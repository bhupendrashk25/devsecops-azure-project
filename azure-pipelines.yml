trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: devsecops-nonprod

stages:

# ========================================================
# 1. SAST - Bandit
# ========================================================

- stage: SAST
  displayName: "Security: Static Analysis (Bandit)"
  dependsOn: []

  jobs:
  - job: BanditScan
    displayName: "Bandit Scan & Report"

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------------
    # Setup Python
    # ----------------------------------------------------

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: "Set up Python Environment"

    # ----------------------------------------------------
    # Run Bandit
    # ----------------------------------------------------

    - script: |
        python -m pip install --upgrade pip
        pip install bandit jq

        mkdir -p reports

        bandit -r app \
          -f json \
          -o reports/bandit.json || true
      displayName: "Run Bandit Scan"

    # ----------------------------------------------------
    # Convert Bandit JSON to SARIF
    # ----------------------------------------------------

    - script: |
        python scripts/bandit_to_sarif.py \
          reports/bandit.json \
          reports/bandit.sarif
      displayName: "Convert Bandit JSON to SARIF"

    # ----------------------------------------------------
    # Publish SAST Summary
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        SUMMARY_FILE="$(Pipeline.Workspace)/sast-summary.md"
        REPORT="reports/bandit.json"

        TOTAL_ISSUES=$(jq '.results | length' "$REPORT")

        if [ "$TOTAL_ISSUES" -eq 0 ]; then

          echo "## ✅ SAST Scan Results: Bandit" > "$SUMMARY_FILE"
          echo "No high-risk security issues were detected in the source code." >> "$SUMMARY_FILE"

        else

          echo "## ❌ SAST Security Issues: Bandit" > "$SUMMARY_FILE"
          echo "Found **$TOTAL_ISSUES** issues that require attention." >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "| Severity | Issue | File | Line |" >> "$SUMMARY_FILE"
          echo "| :--- | :--- | :--- | :--- |" >> "$SUMMARY_FILE"

          jq -r '.results[] |
            "| \(.issue_severity) | \(.issue_text) | \(.filename) | \(.line_number) |"
          ' "$REPORT" >> "$SUMMARY_FILE"

        fi

        echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=SAST Scan Results]$SUMMARY_FILE"

      displayName: "Publish SAST Summary to Dashboard"

    # ----------------------------------------------------
    # SAST Quality Gate
    # ----------------------------------------------------

    - script: |
        HIGH_COUNT=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' reports/bandit.json)

        if [ "$HIGH_COUNT" -gt 0 ]; then
          echo "❌ SECURITY GATE FAILED: $HIGH_COUNT HIGH severity issues found."
          exit 1
        fi

        echo "✅ SECURITY GATE PASSED: No HIGH severity issues found."

      displayName: "Check Quality Gate (Fail on HIGH)"

    # ----------------------------------------------------
    # Publish Bandit Reports
    # ----------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: "Upload Security Logs"
      inputs:
        pathToPublish: 'reports'
        artifactName: 'CodeAnalysisLogs'


# ========================================================
# 2. Dependency Scan - pip-audit
# ========================================================

- stage: DependencyScan
  displayName: "Security: Dependency Scan (pip-audit)"
  dependsOn: SAST

  jobs:
  - job: PipAudit
    displayName: "Python Dependency Vulnerability Scan"

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------------
    # Setup Python
    # ----------------------------------------------------

    - task: UsePythonVersion@0
      displayName: "Set up Python Environment"
      inputs:
        versionSpec: '3.11'

    # ----------------------------------------------------
    # Run pip-audit
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        python -m pip install --upgrade pip
        pip install pip-audit jq

        mkdir -p reports

        pip-audit \
          -r requirements.txt \
          --timeout 30 \
          --format json \
          --output reports/pip-audit.json || true

      displayName: "Run pip-audit Scan"

    # ----------------------------------------------------
    # Dependency Summary
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        SUMMARY_FILE="$(Pipeline.Workspace)/dependency-summary.md"
        REPORT="reports/pip-audit.json"

        TOTAL_VULNS=$(jq '[.dependencies[].vulns[]?] | length' "$REPORT")

        if [ "$TOTAL_VULNS" -eq 0 ]; then

          {
            echo "## ✅ Dependency Scan"
            echo "No vulnerable dependencies were found in requirements.txt."
          } > "$SUMMARY_FILE"

        else

          {
            echo "## ⚠️ Dependency Vulnerabilities Found"
            echo "Found **$TOTAL_VULNS** known vulnerabilities."
            echo ""
            echo "| Package | Version | CVE ID | Severity |"
            echo "| :--- | :--- | :--- | :--- |"

            jq -r '
              .dependencies[]
              | select(.vulns != null)
              | . as $dep
              | $dep.vulns[]
              | "| \($dep.name) | \($dep.version) | \(.id) | \(.severity // "UNKNOWN") |"
            ' "$REPORT"

          } > "$SUMMARY_FILE"

        fi

        echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=Dependency Scan]$SUMMARY_FILE"

      displayName: "Publish Dependency Summary to Dashboard"

    # ----------------------------------------------------
    # Dependency Security Gate
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        REPORT="reports/pip-audit.json"

        echo "--- Security Policy Audit ---"

        BLOCK_COUNT=$(jq '
          [
            .dependencies[].vulns[]?
            | select(
                (.severity // "UNKNOWN" | ascii_upcase) == "HIGH"
                or
                (.severity // "UNKNOWN" | ascii_upcase) == "CRITICAL"
                or
                (.severity // "UNKNOWN" | ascii_upcase) == "UNKNOWN"
              )
          ] | length
        ' "$REPORT")

        if [ "$BLOCK_COUNT" -gt 0 ]; then

          echo "❌ POLICY VIOLATION: Found $BLOCK_COUNT high-risk vulnerabilities."

          jq -r '
            .dependencies[]
            | select(.vulns != null)
            | . as $dep
            | $dep.vulns[]
            | select(
                (.severity // "UNKNOWN" | ascii_upcase) == "HIGH"
                or
                (.severity // "UNKNOWN" | ascii_upcase) == "CRITICAL"
                or
                (.severity // "UNKNOWN" | ascii_upcase) == "UNKNOWN"
              )
            | "Package: \($dep.name) (\($dep.version)) -> \(.id) [\(.severity // "UNKNOWN")]"
          ' "$REPORT"

          exit 1
        fi

        echo "✅ POLICY PASSED: No blocking vulnerabilities found."

      displayName: "Enforce Security Policy (High/Critical)"

    # ----------------------------------------------------
    # Publish Dependency Report
    # ----------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: "Upload Dependency Scan Logs"
      inputs:
        pathToPublish: 'reports/pip-audit.json'
        artifactName: 'DependencyScanReports'


# ========================================================
# 3. Tests & Coverage
# ========================================================

- stage: Tests
  displayName: "Unit Tests & Coverage"
  dependsOn: DependencyScan

  jobs:
  - job: TestAndCover
    displayName: "Execute Pytest with Coverage"

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------------
    # Setup Python
    # ----------------------------------------------------

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)
      displayName: "Setup Python"

    # ----------------------------------------------------
    # Install Dependencies
    # ----------------------------------------------------

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
      displayName: "Install Dependencies"

    # ----------------------------------------------------
    # Run Tests + Coverage
    # ----------------------------------------------------

    - script: |
        export PYTHONPATH=$(System.DefaultWorkingDirectory)

        mkdir -p reports

        pytest \
          --junitxml=reports/junit.xml \
          --cov=app \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=80

      displayName: "Run Pytest with 80% Coverage Gate"

    # ----------------------------------------------------
    # Publish Test Results
    # ----------------------------------------------------

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: reports/junit.xml
        failTaskOnFailedTests: true
      displayName: "Publish Test Results to Azure UI"

    # ----------------------------------------------------
    # Publish Coverage
    # ----------------------------------------------------

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      displayName: "Publish Coverage Results to Azure UI"


# ========================================================
# 4. Container Build + Trivy Scan + PUSH SAME IMAGE
# ========================================================

- stage: ContainerScan
  displayName: "Container: Build, Scan & Push"
  dependsOn: Tests

  jobs:
  - job: BuildScanPush
    displayName: "Build ARM64 Image, Scan and Push to ACR"

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------------
    # Login to Azure Container Registry
    # ----------------------------------------------------

    - task: Docker@2
      displayName: "Login to Azure Container Registry"
      inputs:
        command: login
        containerRegistry: 'azure-docker-connection'

    # ----------------------------------------------------
    # Setup Docker Buildx
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo "Setting up Docker Buildx"
        echo "=========================================="

        docker buildx create \
          --name devsecops-builder \
          --driver docker-container \
          --use || docker buildx use devsecops-builder

        docker buildx inspect --bootstrap

      displayName: "Setup Docker Buildx"

    # ----------------------------------------------------
    # Setup ARM64 Runtime / QEMU
    #
    # Azure DevOps hosted agent is AMD64.
    # Application image is ARM64.
    #
    # This allows ARM64 containers to execute on
    # the AMD64 build agent during verification.
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo "Setting up ARM64 emulation"
        echo "=========================================="

        docker run --privileged --rm \
          tonistiigi/binfmt:latest \
          --install arm64

        echo "ARM64 emulation setup completed."

        echo ""
        echo "Testing ARM64 container execution..."

        docker run --rm \
          --platform linux/arm64 \
          arm64v8/alpine:latest \
          uname -m

      displayName: "Setup ARM64 Runtime"

    # ----------------------------------------------------
    # Build ARM64 Image
    #
    # IMPORTANT:
    # AKS nodes are ARM64.
    # Therefore image is explicitly built for linux/arm64.
    #
    # --load means the SAME image is loaded into
    # the local Docker image store.
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo "Building ARM64 Docker Image"
        echo "=========================================="

        docker buildx build \
          --platform linux/arm64 \
          --no-cache \
          --load \
          -t "$(acrLoginServer)/$(imageName):$(Build.BuildId)" \
          -t "$(acrLoginServer)/$(imageName):latest" \
          .

        echo ""
        echo "=========================================="
        echo "Built Image"
        echo "=========================================="

        docker image inspect \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)" \
          --format '{{.RepoTags}}'

      displayName: "Build ARM64 Docker Image"

    # ----------------------------------------------------
    # Verify Image Architecture
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo "Docker Image Architecture"
        echo "=========================================="

        docker image inspect \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)" \
          --format 'OS={{.Os}} ARCH={{.Architecture}}'

      displayName: "Verify ARM64 Image"

    # ----------------------------------------------------
    # Verify Python Security Packages
    #
    # IMPORTANT:
    # Image is ARM64 but Azure agent is AMD64.
    #
    # Therefore every docker run MUST use:
    # --platform linux/arm64
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo " Python Package Verification"
        echo "=========================================="

        IMAGE="$(acrLoginServer)/$(imageName):$(Build.BuildId)"

        echo ""
        echo "===== setuptools ====="

        docker run --rm \
          --platform linux/arm64 \
          "$IMAGE" \
          python -m pip show setuptools || true

        echo ""
        echo "===== msgpack ====="

        docker run --rm \
          --platform linux/arm64 \
          "$IMAGE" \
          python -m pip show msgpack || true

        echo ""
        echo "===== wheel ====="

        docker run --rm \
          --platform linux/arm64 \
          "$IMAGE" \
          python -m pip show wheel || true

        echo ""
        echo "===== jaraco.context ====="

        docker run --rm \
          --platform linux/arm64 \
          "$IMAGE" \
          python -m pip show jaraco.context || true

        echo ""
        echo "===== Checking /usr/local packages ====="

        docker run --rm \
          --platform linux/arm64 \
          "$IMAGE" \
          sh -c "find /usr/local/lib/python3.11/site-packages \
          -maxdepth 1 \
          \( -name 'setuptools*' -o -name 'msgpack*' -o -name 'wheel*' \) \
          -print"

        echo ""
        echo "===== Checking /opt/venv packages ====="

        docker run --rm \
          --platform linux/arm64 \
          "$IMAGE" \
          sh -c "find /opt/venv/lib/python3.11/site-packages \
          -maxdepth 1 \
          \( -name 'setuptools*' -o -name 'msgpack*' -o -name 'wheel*' \) \
          -print"

      displayName: "Verify Python Security Packages"

    # ----------------------------------------------------
    # Run Trivy Scan - SAME IMAGE
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        mkdir -p "$(Pipeline.Workspace)/reports"

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$(Pipeline.Workspace)/reports:/root/.cache" \
          aquasec/trivy:latest \
          image \
          --format json \
          --output /root/.cache/trivy-results.json \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)"

      displayName: "Run Trivy Scan (JSON Output)"

    # ----------------------------------------------------
    # Publish Trivy Summary
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        REPORT="$(Pipeline.Workspace)/reports/trivy-results.json"
        SUMMARY_FILE="$(Pipeline.Workspace)/container-summary.md"
        TABLE_FILE="$(Pipeline.Workspace)/trivy-table.txt"

        if [ ! -f "$REPORT" ]; then
          echo "❌ Trivy report not found: $REPORT"
          exit 1
        fi

        VULNS=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$REPORT")

        echo "## 🐳 Container Security Scan (Trivy)" > "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"

        if [ "$VULNS" -eq 0 ]; then

          echo "✅ No vulnerabilities found in the Docker image." >> "$SUMMARY_FILE"

        else

          echo "⚠️ Found **$VULNS** total vulnerabilities." >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"

          echo "| Severity | Library | Vulnerability ID | Fixed Version |" >> "$SUMMARY_FILE"
          echo "| :--- | :--- | :--- | :--- |" >> "$SUMMARY_FILE"

          jq -r '
            .Results[]?.Vulnerabilities[]?
            | "| \(.Severity) | \(.PkgName) | \(.VulnerabilityID) | \(.FixedVersion // "N/A") |"
          ' "$REPORT" > "$TABLE_FILE"

          head -n 10 "$TABLE_FILE" >> "$SUMMARY_FILE"

        fi

        echo "" >> "$SUMMARY_FILE"
        echo "Total vulnerabilities: **$VULNS**" >> "$SUMMARY_FILE"

        echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=Container Security]$SUMMARY_FILE"

      displayName: "Publish Container Scan Summary"

    # ----------------------------------------------------
    # Trivy Security Gate
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo "Running Trivy Security Gate"
        echo "=========================================="

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest \
          image \
          --scanners vuln \
          --ignore-unfixed \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)"

        echo "✅ Trivy Security Gate PASSED"

      displayName: "Trivy Security Gate (Fail on High/Critical)"

    # ----------------------------------------------------
    # PUSH THE SAME IMAGE
    #
    # IMPORTANT:
    # This is NOT buildAndPush.
    # The image above was already built and scanned.
    # We are pushing that exact local image.
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo "Pushing SAME Scanned Image to ACR"
        echo "=========================================="

        docker push \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)"

        docker push \
          "$(acrLoginServer)/$(imageName):latest"

        echo ""
        echo "=========================================="
        echo "Image pushed successfully"
        echo "=========================================="

        echo "Image:"
        echo "$(acrLoginServer)/$(imageName):$(Build.BuildId)"

      displayName: "Push SAME Image to ACR"

    # ----------------------------------------------------
    # Verify Image in ACR
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        echo "=========================================="
        echo "Verifying Image in ACR"
        echo "=========================================="

        docker pull \
          --platform linux/arm64 \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)"

        echo ""
        echo "Image architecture after ACR pull:"

        docker image inspect \
          "$(acrLoginServer)/$(imageName):$(Build.BuildId)" \
          --format 'OS={{.Os}} ARCH={{.Architecture}}'

      displayName: "Verify ACR Image"


# ========================================================
# 5. IaC Security Scan - Checkov
# ========================================================

- stage: IaCScan
  displayName: "Security: K8s Manifest Scan"
  dependsOn: ContainerScan

  jobs:
  - job: CheckovScan
    displayName: "Checkov Static Analysis"

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    # ----------------------------------------------------
    # Install Checkov
    # ----------------------------------------------------

    - script: |
        pip install checkov
      displayName: "Install Checkov"

    # ----------------------------------------------------
    # Run Checkov
    # ----------------------------------------------------

    - script: |
        mkdir -p reports

        checkov \
          -d k8s/ \
          --output junitxml \
          > reports/checkov-report.xml || true

      displayName: "Run Checkov Scan (JUnit Output)"

    # ----------------------------------------------------
    # Checkov Summary
    # ----------------------------------------------------

    - script: |
        set -euo pipefail

        SUMMARY_FILE="$(Pipeline.Workspace)/iac-summary.md"

        checkov \
          -d k8s/ \
          --quiet \
          --no-guide \
          > "$(Pipeline.Workspace)/checkov_raw.txt" || true

        echo "## 🏗️ Infrastructure as Code Scan (Checkov)" > "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"

        echo "Reviewing Kubernetes manifests for security misconfigurations." >> "$SUMMARY_FILE"
        echo "" >> "$SUMMARY_FILE"

        echo '```text' >> "$SUMMARY_FILE"

        grep -A 5 "Passed checks:" \
          "$(Pipeline.Workspace)/checkov_raw.txt" \
          >> "$SUMMARY_FILE" || true

        echo '```' >> "$SUMMARY_FILE"

        echo "##vso[task.addattachment type=Distributedtask.Core.Summary;name=IaC Security Results]$SUMMARY_FILE"

      displayName: "Publish IaC Summary"

    # ----------------------------------------------------
    # Publish Checkov Test Results
    # ----------------------------------------------------

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'reports/checkov-report.xml'
        testRunTitle: 'Checkov IaC Scan'
      displayName: "Display IaC Results in Tests Tab"

    # ----------------------------------------------------
    # Checkov Security Gate
    # ----------------------------------------------------

    - script: |
        echo "Checking for Critical Kubernetes Misconfigurations..."

        checkov \
          -d k8s/ \
          --check CKV_K8S_1,CKV_K8S_2

      displayName: "Enforce IaC Policy (Fail on Root/Privilege)"

    # ----------------------------------------------------
    # Publish Kubernetes Manifests
    # ----------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: "Publish K8s Manifests"
      inputs:
        targetPath: 'k8s'
        artifact: 'manifests'


# ========================================================
# 6. Deploy DEV
# ========================================================

- stage: DeployDev
  displayName: "Deploy: Dev"
  dependsOn: IaCScan

  jobs:
  - deployment: DevDeploy
    displayName: "Deploy to Development"

    environment: 'development'

    strategy:
      runOnce:
        deploy:
          steps:

          # ------------------------------------------------
          # Download K8s Manifests
          # ------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: "Download K8s Manifests"
            inputs:
              artifact: 'manifests'
              path: '$(Pipeline.Workspace)/manifests'

          # ------------------------------------------------
          # Create DEV Namespace
          # ------------------------------------------------

          - task: Kubernetes@1
            displayName: "Create DEV Namespace"
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(k8Connection)'
              command: 'apply'
              useConfigurationFile: true
              configurationType: 'inline'
              inline: |
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: $(devNamespace)

          # ------------------------------------------------
          # Deploy DEV
          # ------------------------------------------------

          - task: KubernetesManifest@0
            displayName: "Deploy Application to DEV"
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aks-service-connection'
              namespace: $(devNamespace)
              manifests: '$(Pipeline.Workspace)/manifests/*.y*ml'
              containers: '$(acrLoginServer)/$(imageName):$(Build.BuildId)'


# ========================================================
# 7. Deploy QA
# ========================================================

- stage: DeployQA
  displayName: "Deploy: QA"
  dependsOn: DeployDev

  jobs:
  - deployment: QADeploy
    displayName: "Deploy to QA"

    environment: 'testing'

    strategy:
      runOnce:
        deploy:
          steps:

          # ------------------------------------------------
          # Download K8s Manifests
          # ------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: "Download K8s Manifests"
            inputs:
              artifact: 'manifests'
              path: '$(Pipeline.Workspace)/manifests'

          # ------------------------------------------------
          # Create QA Namespace
          # ------------------------------------------------

          - task: Kubernetes@1
            displayName: "Create QA Namespace"
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(k8Connection)'
              command: 'apply'
              useConfigurationFile: true
              configurationType: 'inline'
              inline: |
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: $(qaNamespace)

          # ------------------------------------------------
          # Deploy QA
          # ------------------------------------------------

          - task: KubernetesManifest@0
            displayName: "Deploy Application to QA"
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aks-service-connection'
              namespace: $(qaNamespace)
              manifests: '$(Pipeline.Workspace)/manifests/*.y*ml'
              containers: '$(acrLoginServer)/$(imageName):$(Build.BuildId)'


# ========================================================
# 8. Deploy PROD
# ========================================================

- stage: DeployProd
  displayName: "Deploy: Production"
  dependsOn: DeployQA

  jobs:
  - deployment: ProdDeploy
    displayName: "Deploy to Production"

    environment: 'production'

    strategy:
      runOnce:
        deploy:
          steps:

          # ------------------------------------------------
          # Download K8s Manifests
          # ------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: "Download K8s Manifests"
            inputs:
              artifact: 'manifests'
              path: '$(Pipeline.Workspace)/manifests'

          # ------------------------------------------------
          # Deploy PROD
          # ------------------------------------------------

          - task: KubernetesManifest@0
            displayName: "Deploy Application to PROD"
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aks-service-connection'
              namespace: $(prodNamespace)
              manifests: '$(Pipeline.Workspace)/manifests/*.y*ml'
              containers: '$(acrLoginServer)/$(imageName):$(Build.BuildId)'
